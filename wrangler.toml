name = "kira"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[ai]
binding = "AI"

# Painel administrativo (/admin): precisa do KV "CONFIG" e do secret ADMIN_PASSWORD.
#   npx wrangler kv namespace create kira-config --binding CONFIG --update-config
#   npx wrangler pages secret put ADMIN_PASSWORD --project-name kira
# Opcional: ANTHROPIC_API_KEY (secret) é usada enquanto o painel não tiver uma IA configurada.
